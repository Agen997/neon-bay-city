<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neon Bay — an original open-world crime game: steal cars, dodge the NBPD, and run five story jobs across a sun-soaked bay city.">
<meta name="theme-color" content="#0b0e1a">
<title>Neon Bay — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Bay: an original open-world crime game. Steal cars, dodge the police, and run five story jobs across the city."></canvas>
<noscript><p style="color:#fff;font-family:sans-serif;padding:2rem">Neon Bay needs JavaScript to run: it is a game, not a page.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
