<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c18; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: auto; background: #1d6f8e; }
  #hint { color: #8a93a8; font: 13px sans-serif; text-align: center; padding: 8px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Neon Bay — WASD move / drive · mouse aim · click shoot · Space melee · E enter or steal a car · Shift run · P pause · M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
